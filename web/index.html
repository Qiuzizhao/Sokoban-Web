<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f8f5">
  <title>推箱子</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <a class="brand" href="#" aria-label="推箱子"><img src="assets/box.png" alt=""><span>推箱子<span class="brand-dot">.</span></span></a>
    <div class="header-actions">
      <button class="solution-trigger" id="profile-toggle" hidden>切换身份</button>
      <button class="solution-trigger" id="show-solution">解法演示</button>
      <button class="solution-trigger" id="hint-toggle" title="A* 辅助" aria-label="A* 辅助" aria-pressed="false">A*<span class="hint-caption"> 辅助</span></button>
      <button class="icon-button mobile-catalog" id="catalog-toggle" title="选择关卡" aria-label="选择关卡"><i data-lucide="grid-2x2"></i></button>
      <button class="icon-button" id="sound" title="开启音效" aria-label="开启音效" aria-pressed="false"><i data-lucide="volume-x"></i></button>
      <button class="icon-button" id="fullscreen" title="全屏" aria-label="全屏"><i data-lucide="maximize"></i></button>
    </div>
  </header>
  <main class="layout">
    <aside class="catalog" id="catalog" aria-label="关卡选择">
      <div class="catalog-heading"><h2>关卡</h2><button id="catalog-close" class="icon-button mobile-catalog" aria-label="关闭选关" title="关闭选关"><i data-lucide="x"></i></button><span class="total">50</span></div>
      <div class="progress-line"><span>已完成 <b id="completed-count">0</b> / 50</span><span id="completion-percent">0%</span></div>
      <div class="progress-track"><div id="completion-bar"></div></div>
      <div class="level-tabs" role="tablist" aria-label="关卡分组"><button role="tab" aria-selected="true" data-page="0">01 — 25</button><button role="tab" aria-selected="false" data-page="1">26 — 50</button></div>
      <div class="level-grid" id="level-grid"></div>
      <div class="catalog-bottom"><img src="assets/playerDown.png" alt=""><div><span>小小控制员</span><p id="personal-best">还未通关</p></div></div>
    </aside>
    <section class="game" aria-label="推箱子游戏">
      <div class="game-heading"><div class="level-title"><span class="eyebrow">PUSH THE BOX</span><h1>第 <span id="level-number">01</span> 关</h1></div><p class="optimal-moves">最优解 <strong id="optimal-moves"></strong> 步</p><div class="level-navigation"><button class="icon-button" id="previous" title="上一关" aria-label="上一关"><i data-lucide="chevron-left"></i></button><button class="icon-button" id="next" title="下一关" aria-label="下一关"><i data-lucide="chevron-right"></i></button></div></div>
      <div class="stats"><div><i data-lucide="footprints"></i><span>步数</span><strong id="moves">0</strong></div><div><i data-lucide="box"></i><span>推动</span><strong id="pushes">0</strong></div><div class="goal-stat"><i data-lucide="circle-check"></i><span>归位</span><strong id="goals">0 / 2</strong></div></div>
      <div class="board-stage" id="board-stage"><div id="board" class="board" tabindex="0" role="application" aria-label="推箱子棋盘"></div></div>
      <div class="bottom-controls">
        <div class="tools"><button class="icon-button" id="undo" title="撤回" aria-label="撤回"><i data-lucide="undo-2"></i></button><button class="icon-button" id="redo" title="重做" aria-label="重做"><i data-lucide="redo-2"></i></button><button class="icon-button" id="restart" title="重新开始" aria-label="重新开始"><i data-lucide="rotate-ccw"></i></button></div>
        <div class="dpad" aria-label="方向控制"><button class="icon-button" data-direction="up" title="向上" aria-label="向上"><i data-lucide="arrow-up"></i></button><button class="icon-button" data-direction="left" title="向左" aria-label="向左"><i data-lucide="arrow-left"></i></button><button class="icon-button" data-direction="down" title="向下" aria-label="向下"><i data-lucide="arrow-down"></i></button><button class="icon-button" data-direction="right" title="向右" aria-label="向右"><i data-lucide="arrow-right"></i></button></div>
        <div class="solution-controls" id="solution-controls" role="group" aria-label="最优解播放控制" hidden>
          <p id="solution-progress"></p>
          <button id="solution-play" class="primary-button">暂停演示</button>
          <button id="solution-step" class="secondary-button">下一步</button>
          <label for="solution-speed">速度</label>
          <select id="solution-speed"><option value="600">0.5×</option><option value="300" selected>1×</option><option value="150">2×</option></select>
          <button id="solution-exit" class="secondary-button">返回棋局</button>
        </div>
      </div>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </section>
  </main>
  <dialog id="profile-dialog" aria-labelledby="profile-title">
    <div class="profile-shell">
      <div class="profile-hero" aria-hidden="true">
        <div class="profile-tiles">
          <span></span><span><img src="assets/box.png" alt=""></span>
          <span><img src="assets/playerDown.png" alt=""></span><span><img src="assets/goal.png" alt=""></span>
        </div>
        <strong>推箱子</strong>
      </div>
      <div class="profile-panel">
        <button id="profile-back" class="profile-link" hidden>返回游戏</button>
        <button id="profile-modes-back" class="profile-link" hidden><i data-lucide="chevron-left"></i>选择身份</button>
        <h2 id="profile-title">选择游玩身份</h2>
        <div class="profile-actions" id="profile-modes">
          <button id="play-guest" class="profile-choice" aria-label="游客">
            <span class="profile-icon"><i data-lucide="user-round"></i></span>
            <span><strong>游客</strong><small>进度保存在这台设备</small></span>
            <i data-lucide="arrow-right"></i>
          </button>
          <button id="play-campus" class="profile-choice profile-choice-campus" aria-label="校园">
            <span class="profile-icon"><i data-lucide="school"></i></span>
            <span><strong>校园</strong><small>换设备也能续关</small></span>
            <i data-lucide="arrow-right"></i>
          </button>
        </div>
        <div id="profile-class-field" class="profile-field" hidden>
          <label for="profile-class">班级</label>
          <select id="profile-class"></select>
        </div>
        <div id="profile-roster" class="profile-field" hidden>
          <div class="profile-roster-heading">
            <h3 id="profile-names">点自己的名字进入游戏</h3>
            <input id="profile-search" type="search" placeholder="搜索姓名" aria-label="搜索姓名" autocomplete="off" hidden>
          </div>
          <div id="profile-students" class="profile-students" role="group" aria-labelledby="profile-names"></div>
        </div>
        <p id="profile-message" role="status"></p>
      </div>
    </div>
  </dialog>
  <dialog id="success"><div class="success-content"><div class="success-mark"><i data-lucide="check"></i></div><span class="eyebrow">LEVEL COMPLETE</span><h2>全部归位！</h2><p id="success-stats"></p><div class="success-actions"><button class="secondary-button" id="success-close">返回棋盘</button><button class="primary-button" id="success-next">下一关 <i data-lucide="arrow-right"></i></button></div></div></dialog>
  <dialog id="solution-lock" aria-labelledby="solution-title">
    <form id="solution-form" class="solution-form">
      <h2 id="solution-title">最优解演示</h2>
      <label for="solution-password" id="solution-password-label">演示密码</label>
      <input id="solution-password" type="password" autocomplete="off" maxlength="128" required autofocus>
      <p id="solution-error" role="status"></p>
      <div class="solution-actions">
        <button id="solution-cancel" class="secondary-button" type="button">取消</button>
        <button id="solution-unlock" class="primary-button" type="submit">解锁并播放</button>
      </div>
    </form>
  </dialog>
  <script src="game.js"></script>
</body>
</html>
